# ADAXAI application settings.
#
# NO SECRETS HERE. API keys and passwords live only in .env (git-ignored).
# Validated at API start-up (apps/api/src/settings/schema.ts); an invalid file
# stops the API with a message naming the setting.
#
# Changes to this file take effect after an API restart.
# (Routing rules in routing.yaml are re-read at runtime; see that file.)
version: 1

ai:
  # Feature switches. A disabled feature reports itself unavailable; it never
  # produces placeholder output.
  features:
    noteDraft: true
    extraction: true
    recommendations: true
    imageAnalysis: true
    liveTranscription: true
    # Mana AI summaries of the patient record (answers read directly from the
    # record by explicit rules are always available and need no AI provider).
    patientQa: true
    # Local AI consultation intelligence (V3): a draft for the doctor to review, made by the local model below.
    consultationDraft: true

  # HOSTED AI EGRESS. May consultation text (pseudonymised, best effort) be sent to a hosted AI provider (Anthropic) for note drafts, recommendations,
  # Mana summaries and photo descriptions? `false`: never, and the features below say "unavailable" even if ANTHROPIC_API_KEY is set: a key in .env
  # does not turn this on. `true`: allowed on purpose, and each use still needs the patient's consent and the doctor's click. Env AI_EGRESS_HOSTED
  # (true/false) overrides this value. Audio never leaves this computer under either setting: there is no hosted speech provider.
  egress:
    hostedProviders: false

  # THE REASONING MODEL (V3 consultation drafts, V4 Mana). `local`: an open-weight model served by llama.cpp on THIS computer (install it with
  # `npm run llm:setup`, run it with `npm run dev:llm`); the patient's record goes to a loopback address and nowhere else. `none`: switched off.
  # `hosted`: the hosted provider, only if hosted egress below is on AND a key is set; it is never used because the local model is down (nothing falls
  # back). If the local model is not running the screens say "Local AI unavailable." and make no draft. Env LLM_PROVIDER / LLM_URL override these.
  reasoning:
    provider: local
    url: http://127.0.0.1:8081
    # A draft takes minutes on a laptop CPU; this is the longest one answer may take.
    timeoutSeconds: 900
    maxOutputTokens: 2600
    # How much record text the model is shown (characters across all sources). Older items that do not fit are not shown, and the draft says how many.
    maxContextChars: 14000
    # How many other requests may wait for the one local model; more are refused.
    maxWaiting: 3

  # Language model for drafting, extraction and recommendations.
  # Env AI_NOTE_MODEL overrides `model`. Key: ANTHROPIC_API_KEY.
  llm:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
    maxOutputTokens: 16000
    timeoutSeconds: 120

  # Image description. Key: ANTHROPIC_API_KEY.
  vision:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium

  # Speech-to-text runs on this machine only: the local speech service in
  # services/speech (faster-whisper). There is no hosted option and no fallback.
  # `none` until it is configured on purpose: env SPEECH_PROVIDER=local (and
  # SPEECH_URL, default below) override these. Audio goes to a loopback address
  # only; see docs/adr/0014-local-speech-service-and-capture-pipeline.md.
  stt:
    provider: none
    url: http://127.0.0.1:8002
    # Live recording is sent in chunks of this length and each chunk is
    # transcribed as it arrives (no interim, guessed words are ever shown).
    # 10 s keeps the conversation close to live on this CPU (about 5 s per
    # part with the hint below); 5 s parts would run at about real time and
    # queue up. Measure on the real speech service before changing it.
    liveChunkSeconds: 10
    # A language code (for example en) makes the model skip language detection
    # (about 2 s saved per part; the MVP and the important-point rules are
    # English only). null: it detects the language of each part and the
    # transcript says which.
    languageHint: en

  # How the "important points" of a consultation are found: `rules` is a fixed,
  # versioned rule set that runs in this process (no data leaves it); `llm`
  # uses the hosted language model above and sends pseudonymised text to it.
  extraction:
    provider: rules

  # How much of the patient's record the recommendation step may see.
  context:
    priorEncounters: 5
    observationDays: 30

uploads:
  audio:
    maxMb: 25
    types: [audio/webm, audio/ogg, audio/mpeg, audio/mp4, audio/x-m4a, audio/wav, audio/x-wav, audio/wave]
  images:
    maxMb: 20
    # Formats the validation service and the configured vision provider both
    # handle. DICOM and other medical formats are NOT supported.
    types: [image/jpeg, image/png, image/webp]
    maxPixels: 40000000
    previewMaxSide: 2048

# Mana AI: how much of one patient's record a question can draw on.
mana:
  # Signed consultations included, newest first.
  maxEncounters: 10
  # Vital signs from this many days back.
  observationDays: 365
  # Records older than this are flagged "possibly outdated" (a display aid,
  # not clinical guidance).
  outdatedDays: 180
  # Upper bound on record text sent to the AI provider for one question.
  maxContextChars: 30000

# Device readings (V5): how current a reading from a device is said to be. A display rule, not clinical guidance: it says how old a value
# is and whether its gateway is still in contact, nothing about whether the value is right (every device reading is "unverified").
# Env DEVICE_LIVE_SECONDS and DEVICE_DISCONNECTED_SECONDS override these (the end-to-end tests use short ones).
devices:
  # A reading measured at most this many seconds ago is LIVE; an older one is STALE.
  liveSeconds: 30
  # A device whose gateway has not been heard from for longer than this is DISCONNECTED (must be more than liveSeconds).
  disconnectedSeconds: 120
  # A gateway may send what it buffered while it was out of contact, but not for ever: a reading or recording measured more than this many
  # hours before it arrives is refused. It bounds how far back a device token can write into a patient's record.
  maxLateHours: 24

# Request limits per client address, account, user or device token. They
# slow down password guessing and token abuse; the per-account sign-in lockout
# (5 wrong passwords, 15 minutes) still applies. Kept in memory: a restart
# clears them.
security:
  rateLimits:
    loginPerIp: { max: 300, windowSeconds: 60 }
    loginPerAccount: { max: 30, windowSeconds: 60 }
    activationPerIp: { max: 20, windowSeconds: 900 }
    passwordChangePerUser: { max: 10, windowSeconds: 900 }
    deviceIngestPerToken: { max: 600, windowSeconds: 60 }
    # Stethoscope recordings sent by a gateway are files of up to the audio limit each: far fewer of them are allowed per token.
    deviceRecordingPerToken: { max: 12, windowSeconds: 60 }
    # Per signed-in user: audio parts and uploads (a live recording sends about three parts a minute) and the steps that cost the most to run
    # (note drafts, important points, recommendations). Beyond the limit a request is refused with 429 and the time to wait.
    aiAudioPerUser: { max: 60, windowSeconds: 60 }
    aiStepPerUser: { max: 30, windowSeconds: 60 }

retention:
  # Consultation audio of SIGNED consultations is deleted after this many days
  # by `npm run retention` (the transcript and the signed note are kept).
  # 0 disables deletion.
  consultationAudioDays: 90

safety:
  # Illustrative, INCOMPLETE groups used only to flag a possible
  # allergy/prescription match for the doctor to check. This is not a drug
  # interaction or cross-reactivity database.
  allergyGroups:
    penicillin: [penicillin, amoxicillin, ampicillin, amoxycillin, cloxacillin, flucloxacillin, piperacillin]
    sulfonamide: [sulfamethoxazole, sulphamethoxazole, co-trimoxazole, cotrimoxazole, sulfasalazine]
    nsaid: [ibuprofen, diclofenac, naproxen, aspirin, ketorolac, aceclofenac, mefenamic]
  # Difference between a value said in the consultation and the measured
  # value above which the two are shown as conflicting.
  vitalTolerance:
    temperature: 0.5
    heart_rate: 10
    respiratory_rate: 4
    systolic_bp: 10
    diastolic_bp: 10
    spo2: 2
    blood_glucose: 20
    pain_score: 2
    weight: 2
    height: 3

# Service orders (Order service in the consultation). NO LABORATORY OR IMAGING SYSTEM IS CONNECTED: the only provider is `simulated`, a
# deterministic simulator labelled SIMULATED wherever an order appears. It performs nothing: an order moves to "in progress"
# `inProgressAfterMinutes` after it is requested and to "completed" `turnaroundMinutes` after it is requested, and a completed order says only
# that no test was performed and no result exists. It never writes an investigation result. Codes: upper-case letters, digits, - and _.
serviceOrders:
  provider: simulated
  inProgressAfterMinutes: 1
  catalogue:
    - { code: CBC, name: Complete blood count (CBC), category: lab, turnaroundMinutes: 30 }
    - { code: CRP, name: C-reactive protein (CRP), category: lab, turnaroundMinutes: 45 }
    - { code: RBS, name: Random blood sugar, category: lab, turnaroundMinutes: 20 }
    - { code: FBS, name: Fasting blood sugar, category: lab, turnaroundMinutes: 20 }
    - { code: HBA1C, name: HbA1c, category: lab, turnaroundMinutes: 60 }
    - { code: LFT, name: Liver function tests, category: lab, turnaroundMinutes: 60 }
    - { code: KFT, name: Kidney function tests, category: lab, turnaroundMinutes: 60 }
    - { code: LIPID, name: Lipid profile, category: lab, turnaroundMinutes: 60 }
    - { code: TSH, name: Thyroid stimulating hormone (TSH), category: lab, turnaroundMinutes: 90 }
    - { code: URINE-RE, name: Urine routine and microscopy, category: lab, turnaroundMinutes: 30 }
    - { code: DENGUE-NS1, name: Dengue NS1 antigen, category: lab, turnaroundMinutes: 45 }
    - { code: MALARIA-AG, name: Malaria antigen test, category: lab, turnaroundMinutes: 30 }
    - { code: XRAY-CHEST, name: Chest X-ray (PA view), category: imaging, turnaroundMinutes: 45 }
    - { code: USG-ABDOMEN, name: Ultrasound abdomen, category: imaging, turnaroundMinutes: 90 }
    - { code: CT-HEAD, name: CT head (plain), category: imaging, turnaroundMinutes: 120 }
    - { code: MRI-BRAIN, name: MRI brain, category: imaging, turnaroundMinutes: 240 }
    - { code: ECG, name: 12-lead ECG, category: other, turnaroundMinutes: 15 }
